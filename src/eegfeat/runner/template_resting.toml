# eegfeat recipe for resting-state epochs: fixed-length segments with no event to
# time against, each measured whole. Every measure family that makes sense without
# a stimulus is here; delete what you do not need.
#
#   eegfeat check recipe.toml    validate it, time it on the first recording
#   eegfeat run recipe.toml      compute features for every recording
#
# Relative paths resolve against this file's directory.

[inputs]
root = "derivatives/preprocessed"   # searched recursively
pattern = "**/*_epo.fif"            # MNE epochs files
picks = "eeg"                       # a channel type, or a list of channel names
exclude_bads = true                 # drop the channels each file marks as bad

[output]
root = "derivatives/eegfeat"        # the input tree is mirrored here
epoch_metadata = true               # copy each epoch's metadata into its row

# Frequency bands in Hz, as [low, high). Leaving the section out gives delta,
# theta, alpha, beta and gamma (1-45 Hz).
# [bands]
# theta = [4.0, 8.0]
# alpha = [8.0, 13.0]

# Regions of interest, as channel names or as regular expressions matched against
# each recording's channels. Add "rois" to spatial below to use them.
# [rois]
# frontal = ["Fz", "F3", "F4"]
# parietal = { match = ["^P[z0-9]+$"] }

[spectra]
method = "welch"

# Cross-trial measures pool every epoch of a recording into one row.
[trials]
by = "all"

# Keys every entry below inherits unless it sets its own.
[defaults]
spatial = ["channels", "global"]

# --- power -----------------------------------------------------------------------

[[features]]
measure = "integrated_band_power"
normalize = "log10"
ratios = [["theta", "beta"], ["theta", "alpha"], ["alpha", "beta"]]

# --- spectral shape ----------------------------------------------------------------

[[features]]
measures = ["aperiodic", "spectral_entropy", "spectral_centroid", "spectral_edge"]

[[features]]
measure = "peak_frequency"
bands = ["alpha"]

# --- time domain and complexity ----------------------------------------------------

[[features]]
measures = [
    "variance", "root_mean_square", "line_length", "kurtosis", "skewness",
    "hjorth_mobility", "hjorth_complexity", "higuchi_fractal_dimension",
]

# Entropies are the slowest measures here; eegfeat check says how slow.
[[features]]
measure = "sample_entropy"

# --- bursts ----------------------------------------------------------------------

[[features]]
measures = ["burst_rate", "burst_duration"]
bands = ["alpha", "beta"]

# --- coupling and connectivity -----------------------------------------------------

[[features]]
measure = "pac"
pairs = [["theta", "gamma"]]

[[features]]
measure = "envelope_correlation"
bands = ["alpha", "beta"]
spatial = ["channels"]

# Need pip install 'eegfeat[connectivity]' and 'eegfeat[microstates]':
#
# [[features]]
# measure = "wpli"
# bands = ["alpha", "beta"]
#
# [[features]]
# measures = ["microstate_coverage", "microstate_duration", "microstate_occurrence"]
