[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegfeat"
version = "0.1.0.dev0"
description = "Labelled spectral feature extraction for MNE objects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "mne>=1.8"]

[project.scripts]
eegfeat = "eegfeat.runner.cli:main"
[project.optional-dependencies]
knee = ["specparam>=2.0.0rc7,<3"]
connectivity = ["mne-connectivity>=0.7"]
microstates = ["scikit-learn>=1.3"]
model = ["scikit-learn>=1.3"]
importance = ["scikit-learn>=1.3", "shap>=0.44"]
docs = [
    "furo>=2024.1.29",
    "myst-parser>=3.0",
    "sphinx>=7.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.11", "pandas-stubs", "scipy-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/eegfeat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eegfeat"]

[[tool.mypy.overrides]]
module = ["mne_connectivity.*", "specparam.*", "sklearn.*", "shap.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
