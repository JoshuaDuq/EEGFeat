[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eegfeat"
version = "0.1.0.dev0"
description = "Labelled spectral feature extraction for MNE objects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "mne>=1.8"]

[project.optional-dependencies]
knee = ["specparam>=2.0"]
connectivity = ["mne-connectivity>=0.7"]
microstates = ["scikit-learn>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.11", "pandas-stubs", "scipy-stubs"]

[tool.hatch.build.targets.wheel]
packages = ["src/eegfeat"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/eegfeat"]

[[tool.mypy.overrides]]
module = ["mne_connectivity.*", "specparam.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
