name: ci

on: [push, pull_request]

env:
  MNE_DONTWRITE_HOME: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,model,preprocessing,preprocessing-auto]"
      - run: ruff check src tests
      - run: black --check src tests
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,model,preprocessing,preprocessing-auto]"
      - run: pytest
      # A green general run does not prove that the reference fixture was present
      # or that the complete modeling suite remained collectable.
      - run: test -f tests/fixtures/model_reference.npz
      - run: pytest tests/model tests/test_equivalence_model.py -ra

  optional-integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,model,connectivity,microstates,importance,references,preprocessing,preprocessing-auto,bids]"
      # The cross-checks against third-party implementations are all guarded by
      # find_spec, so a missing package skips them instead of failing. Importing
      # each one here turns that silent skip back into a red build.
      - run: python -c "import antropy, shap, mne_connectivity, sklearn, yaml, autoreject, pyprep, mne_bids"
      - run: >
          pytest tests/test_connectivity.py tests/test_microstates.py
          tests/test_runner_compute.py tests/test_complexity.py tests/test_higuchi.py
          tests/model/test_importance.py tests/paradigm_specific -ra

  # The Go front end is optional for users; its own tests still run here.
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - run: cd tui && test -z "$(gofmt -l .)" && go vet ./... && go test ./...

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - run: python -m venv /tmp/eegfeat-wheel
      - run: /tmp/eegfeat-wheel/bin/pip install dist/*.whl
      - run: /tmp/eegfeat-wheel/bin/python -c "import eegfeat"
      - run: /tmp/eegfeat-wheel/bin/eegfeat --version
      - run: /tmp/eegfeat-wheel/bin/pip install "$(ls dist/*.whl)[preprocessing]"
      - run: cd /tmp && /tmp/eegfeat-wheel/bin/eegfeat preprocess init preprocessing.yaml && /tmp/eegfeat-wheel/bin/eegfeat preprocess steps preprocessing.yaml

  preprocessing-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,preprocessing,preprocessing-auto]" "mne==1.13.2" "pyprep==0.9.0" "autoreject==0.4.3"
      - run: python -c "import yaml, sklearn, pyprep, autoreject"
      - run: MPLBACKEND=Agg pytest tests/preprocessing -ra
